# Render Blueprint: New > Blueprint, then fill in the secrets marked sync: false.
services:
  - type: web
    name: valet
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VALET_MODEL
        value: claude-opus-5-5
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
      - key: VALET_SIGNING_KEY
        sync: false
    # Free plan: the service sleeps after about 15 idle minutes and its files reset
    # on restart, so every visit starts with fresh demo data. For an always-on
    # service that keeps data, use plan: starter and uncomment the disk below.
    # disk:
    #   name: valet-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add an env var DATA_DIR=/var/data)
